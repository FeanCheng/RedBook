name: iosApp
options:
  bundleIdPrefix: com.aguo.redbook
  deploymentTarget:
    iOS: "14.1"
  xcodeVersion: "15.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_OBJC_BRIDGING_HEADER: "$(SRCROOT)/iosApp-Bridging-Header.h"
    ALWAYS_SEARCH_USER_PATHS: "NO"
    CLANG_ENABLE_OBJC_ARC: "YES"

targets:
  iosApp:
    type: application
    platform: iOS
    sources:
      - Sources
    settings:
      base:
        INFOPLIST_FILE: Sources/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.aguo.redbook.iosapp
        PRODUCT_NAME: "RedBook"
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: Apple Development
        DEVELOPMENT_TEAM: ""
        TARGETED_DEVICE_FAMILY: "1,2"
        CLANG_ENABLE_OBJC_ARC: "YES"
        USER_HEADER_SEARCH_PATHS:
          - "$(PROJECT_DIR)/Sources"
        HEADER_SEARCH_PATHS:
          - "$(inherited)"
          - "$(PODS_ROOT)/Headers/Public"
          - "$(PODS_ROOT)/Headers/Public/OpenKuiklyIOSRender"
          - "$(PODS_ROOT)/OpenKuiklyIOSRender"
      debug:
        CODE_SIGN_IDENTITY: Apple Development
      release:
        CODE_SIGN_IDENTITY: Apple Distribution
    dependencies: []

