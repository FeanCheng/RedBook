name: macApp
options:
  bundleIdPrefix: com.aguo.redbook
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "15.0"
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ALWAYS_SEARCH_USER_PATHS: "NO"
    CLANG_ENABLE_MODULES: "YES"
    ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES: "YES"
    LD_RUNPATH_SEARCH_PATHS:
      - "$(inherited)"
      - "@executable_path/../Frameworks"
targets:
  macApp:
    type: application
    platform: macOS
    sources:
      - path: ./macApp
        type: group
        createIntermediateGroups: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aguo.redbook.macapp
        INFOPLIST_FILE: macApp/macOSApp-Info.plist
        SWIFT_OBJC_BRIDGING_HEADER: macApp/macApp-Bridging-Header.h
        SWIFT_VERSION: "5.0"
        PRODUCT_NAME: "RedBook"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: Apple Development
        DEVELOPMENT_TEAM: ""
        FRAMEWORK_SEARCH_PATHS:
          - "$(inherited)"
          - "$(PROJECT_DIR)/Pods/OpenKuiklyIOSRender"
          - "$(PROJECT_DIR)/Pods/OpenKuiklyIOSRender/core-render-ios"
        HEADER_SEARCH_PATHS:
          - "$(inherited)"
          - "$(PROJECT_DIR)/Pods/OpenKuiklyIOSRender/core-render-ios/Handler"
          - "$(PROJECT_DIR)/Pods/OpenKuiklyIOSRender/core-render-ios/Core"
          - "$(PROJECT_DIR)/Pods/OpenKuiklyIOSRender/core-render-ios"
          - "$(PROJECT_DIR)/Pods/OpenKuiklyIOSRender/core"
    dependencies:
      - sdk: AppKit.framework
      - sdk: Foundation.framework
